
<!DOCTYPE html>
<html>
<head>
    <title>Loan Approval Prediction</title>
</head>
<body>

    <h1>Loan Approval Prediction</h1>
    <p>Enter your details to predict your loan status.</p>

    <form action="/predict" method="POST">

        <label>Age:</label>
        <input type="number" name="Age" required>
        <br><br>

        <label>Monthly Income:</label>
        <input type="number" name="Monthly_Income" required>
        <br><br>

        <label>Credit Score:</label>
        <input type="number" name="Credit_Score" required>
        <br><br>

        <label>Employment Years:</label>
        <input type="number" name="Employment_Years" required>
        <br><br>

        <label>Loan Amount:</label>
        <input type="number" name="Loan_Amount" required>
        <br><br>

        <label>Loan Term (Months):</label>
        <input type="number" name="Loan_Term_Months" required>
        <br><br>

        <button type="submit">Predict Loan Status</button>

    </form>

</body>
</html>
